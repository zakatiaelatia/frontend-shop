<!DOCTYPE html>
<html>
<head>
    <title>Frontend Shop</title>
</head>
<body>

<h1>Products 🛒</h1>

<ul id="list"></ul>

<script>
fetch("https://gitapp-btd9gzcgethteed5.polandcentral-01.azurewebsites.net/products")
.then(res => res.json())
.then(data => {
    let list = document.getElementById("list");

    data.forEach(item => {
        let li = document.createElement("li");

        let a = document.createElement("a");
        a.textContent = item.name;
        a.href = item.url;
        a.target = "_blank";

        li.appendChild(a);
        list.appendChild(li);
    });
});
</script>

</body>
</html>
